name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to release'
        required: true
        default: 'expo-media-control'
        type: choice
        options:
          - expo-media-control
          - expo-media-control-car
      version:
        description: 'Release version (e.g., 2.1.0, 1.0.0-beta.1)'
        required: true
        type: string
      prerelease:
        description: 'Is this a prerelease?'
        required: false
        default: false
        type: boolean

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test --workspace "packages/${{ inputs.package }}"

      - name: Build package
        run: |
          npm run build --workspace "packages/${{ inputs.package }}"
          npm run build:plugin --workspace "packages/${{ inputs.package }}"

      # The core keeps its existing X.Y.Z tags; other packages use <name>@X.Y.Z
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ inputs.package }}" = "expo-media-control" ]; then
            echo "name=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.package }}@${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Update version
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          npm version ${{ inputs.version }} --no-git-tag-version --workspace "packages/${{ inputs.package }}"
          git add "packages/${{ inputs.package }}/package.json" package-lock.json
          git commit -m "chore: bump ${{ inputs.package }} to ${{ inputs.version }}"
          git push

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release-notes.md <<NOTES
          ## Changes in ${{ inputs.package }} ${{ inputs.version }}

          Please see [CHANGELOG.md](https://github.com/NO1225/expo-media-control/blob/main/packages/${{ inputs.package }}/CHANGELOG.md) for detailed release notes.

          ## Installation

          \`\`\`bash
          npx expo install ${{ inputs.package }}@${{ inputs.version }}
          \`\`\`
          NOTES
          gh release create "${{ steps.tag.outputs.name }}" \
            --title "${{ inputs.package }} ${{ inputs.version }}" \
            --notes-file release-notes.md \
            --target "$(git rev-parse HEAD)" \
            ${{ inputs.prerelease && '--prerelease' || '' }}

name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm run test -- --passWithNoTests

      - name: Build project
        run: npm run build

      # What npm would publish: a tarball without the compiled plugin or module breaks every app that installs it
      - name: Check the package contents
        run: |
          npm run prepublishOnly
          npm pack --dry-run --json > pack.json
          node -e "
            const files = require('./pack.json')[0].files.map((f) => f.path);
            const needed = ['build/index.js', 'build/index.d.ts', 'plugin/build/index.js', 'app.plugin.js', 'expo-module.config.json', 'android/build.gradle', 'ios/ExpoMediaControl.podspec'];
            const missing = needed.filter((f) => !files.includes(f));
            if (missing.length) { console.error('Missing from the tarball: ' + missing.join(', ')); process.exit(1); }
            console.log(files.length + ' files, all required ones present');
          "

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Extract version from release tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Update package.json version
        run: npm version ${{ steps.get_version.outputs.VERSION }} --no-git-tag-version

      - name: Build project
        run: npm run build

      - name: Publish to NPM
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

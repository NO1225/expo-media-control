name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Build packages
        run: |
          npm run build
          npm run build:plugins

      - name: Type-check packages and example app
        run: npm run typecheck

      - name: Run tests
        run: npm run test -- --passWithNoTests

      # What npm would publish: a tarball without the compiled plugin or module breaks every app that installs it
      - name: Check the package contents
        run: |
          for package in expo-media-control expo-media-control-car; do
            npm run prepublishOnly --workspace "packages/$package"
            npm pack --dry-run --json --workspace "packages/$package" > "pack-$package.json"
            PACKAGE="$package" node -e "
              const name = process.env.PACKAGE;
              const pod = name === 'expo-media-control' ? 'ExpoMediaControl' : 'ExpoMediaControlCar';
              const files = require('./pack-' + name + '.json')[0].files.map((f) => f.path);
              const needed = ['build/index.js', 'build/index.d.ts', 'plugin/build/index.js', 'app.plugin.js', 'expo-module.config.json', 'android/build.gradle', 'ios/' + pod + '.podspec'];
              const missing = needed.filter((f) => !files.includes(f));
              if (missing.length) { console.error(name + ': missing from the tarball: ' + missing.join(', ')); process.exit(1); }
              console.log(name + ': ' + files.length + ' files, all required ones present');
            "
          done

  # The Kotlin and Swift are only compiled by an app build, so build the example app with both packages
  android:
    runs-on: ubuntu-latest
    if: github.event_name != 'release'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - run: npm ci
      - run: npm run build:plugins
      - name: Compile the example app
        working-directory: apps/example
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleDebug -PreactNativeArchitectures=x86_64

  ios:
    runs-on: macos-latest
    if: github.event_name != 'release'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:plugins
      - name: Compile the example app for the Simulator
        working-directory: apps/example
        run: |
          npx expo prebuild --platform ios
          cd ios && xcodebuild -workspace *.xcworkspace -scheme expomediacontrolexample -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet build

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Release tags pick the package to publish:
      #   expo-media-control-car@1.0.0 -> packages/expo-media-control-car
      #   expo-media-control@2.1.0, v2.1.0 or 2.1.0 -> packages/expo-media-control
      - name: Resolve package and version from release tag
        id: target
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$TAG" in
            expo-media-control-car@*) PACKAGE=expo-media-control-car; VERSION="${TAG#expo-media-control-car@}" ;;
            expo-media-control@*) PACKAGE=expo-media-control; VERSION="${TAG#expo-media-control@}" ;;
            v[0-9]*) PACKAGE=expo-media-control; VERSION="${TAG#v}" ;;
            [0-9]*) PACKAGE=expo-media-control; VERSION="$TAG" ;;
            *) echo "Unrecognized release tag: $TAG"; exit 1 ;;
          esac
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $PACKAGE@$VERSION"

      - name: Set package version
        run: npm version "${{ steps.target.outputs.version }}" --no-git-tag-version --allow-same-version --workspace "packages/${{ steps.target.outputs.package }}"

      - name: Check package contents
        run: |
          npm run build --workspace "packages/${{ steps.target.outputs.package }}"
          npm run build:plugin --workspace "packages/${{ steps.target.outputs.package }}"
          npm pack --dry-run --workspace "packages/${{ steps.target.outputs.package }}" 2>&1 | tee pack.log
          # Make sure both the module and the config plugin builds are packed
          grep -q "build/index.js" pack.log
          grep -q "plugin/build/index.js" pack.log

      - name: Publish to npm
        run: npm publish --workspace "packages/${{ steps.target.outputs.package }}" ${{ github.event.release.prerelease && '--tag next' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

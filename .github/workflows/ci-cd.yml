name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Build packages
        run: |
          npm run build
          npm run build:plugins

      - name: Type-check packages and example app
        run: npm run typecheck

      - name: Run tests
        run: npm run test -- --passWithNoTests

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Release tags pick the package to publish:
      #   expo-media-control-car@1.0.0 -> packages/expo-media-control-car
      #   expo-media-control@2.1.0 or v2.1.0 -> packages/expo-media-control
      - name: Resolve package and version from release tag
        id: target
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$TAG" in
            expo-media-control-car@*) PACKAGE=expo-media-control-car; VERSION="${TAG#expo-media-control-car@}" ;;
            expo-media-control@*) PACKAGE=expo-media-control; VERSION="${TAG#expo-media-control@}" ;;
            v*) PACKAGE=expo-media-control; VERSION="${TAG#v}" ;;
            *) echo "Unrecognized release tag: $TAG"; exit 1 ;;
          esac
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $PACKAGE@$VERSION"

      - name: Set package version
        run: npm version "${{ steps.target.outputs.version }}" --no-git-tag-version --workspace "packages/${{ steps.target.outputs.package }}"

      - name: Check package contents
        run: |
          npm run build --workspace "packages/${{ steps.target.outputs.package }}"
          npm run build:plugin --workspace "packages/${{ steps.target.outputs.package }}"
          npm pack --dry-run --workspace "packages/${{ steps.target.outputs.package }}" 2>&1 | tee pack.log
          # Make sure both the module and the config plugin builds are packed
          grep -q "build/index.js" pack.log
          grep -q "plugin/build/index.js" pack.log

      - name: Publish to npm
        run: npm publish --workspace "packages/${{ steps.target.outputs.package }}" ${{ github.event.release.prerelease && '--tag next' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
